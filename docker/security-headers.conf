# Cabeceras de seguridad. Archivo APARTE porque nginx no hereda add_header:
# un location que declara cualquier add_header propio pierde TODOS los del
# bloque server. Asi le paso a /assets/ y /env-config.js (auditoria
# 2026-10-09, S14). Cada location con cabeceras propias incluye este archivo.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# CSP. Lo que la app necesita y nada mas:
#   script  · solo lo propio (el bundle y /env-config.js). Sin inline.
#   style   · propio + inline (los componentes usan style={} y <style>)
#             + Google Fonts, que se importa desde GlobalStyle.
#   connect · Supabase de cualquier proyecto (la imagen sirve a cualquier
#             clinica: la URL llega en tiempo de ejecucion) + su realtime.
#   frame-ancestors 'none' reemplaza a X-Frame-Options: nadie embebe la
#             app en un iframe para engañar clics sobre ella.
# Si se agrega analitica externa (GTM, GA4) o VITE_ANALYTICS_ENDPOINT, su
# dominio tiene que entrar en script-src / connect-src o se bloqueara.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
