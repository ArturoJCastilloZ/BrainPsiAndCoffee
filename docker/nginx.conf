server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Para el HEALTHCHECK del contenedor y los balanceadores.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Archivos con hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Cambian sin cambiar de nombre: el navegador debe revalidarlos.
    # Lo genera docker/40-env-config.sh al arrancar, fuera de la raiz web.
    location = /env-config.js {
        include /etc/nginx/snippets/security-headers.conf;
        alias /tmp/app-config/env-config.js;
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Rutas de React Router: todo lo que no sea un archivo cae en la SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
