server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Para el HEALTHCHECK del contenedor y los balanceadores.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Archivos con hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Cambian sin cambiar de nombre: el navegador debe revalidarlos.
    # Lo genera docker/40-env-config.sh al arrancar, fuera de la raiz web.
    location = /env-config.js {
        include /etc/nginx/snippets/security-headers.conf;
        alias /tmp/app-config/env-config.js;
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Cada ruta tiene su propio HTML prerenderizado (scripts/prerender.mjs):
    # /terapia sirve terapia/index.html, con su titulo y su canonical.
    #
    # Lo que no existe responde 404 DE VERDAD. Antes todo caia en
    # index.html con 200: una URL inventada era una pagina "valida" para
    # Google (soft 404). 404.html es la misma app, que pinta "no existe".
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
