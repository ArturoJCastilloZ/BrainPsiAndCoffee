name: CI

# Solo en push y pull request: sin cron ni matrices, para no gastar
# minutos en corridas que nadie mira.
on:
  push:
    branches: ['**']
  pull_request:

# Una corrida por rama: un push nuevo cancela el anterior en vuelo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Chequeos de codigo: qa-check mas las pruebas de front, que cubren
      # la inyeccion del header del tenant y el CORS de las Edge Functions.
      - name: Pruebas de codigo
        run: npm test

      - name: Build
        run: npm run build

      # El corazon del asunto. Levanta un Postgres desechable, aplica el
      # esquema base y las 11 migraciones, y corre las pruebas de
      # aislamiento entre clinicas. Es el mismo comando que en local: si
      # CI y la maquina del dev divergen, no es por el arnes.
      #
      # El criterio de la Fase 2 vive aqui: un usuario de una clinica pide
      # citas, pacientes y notas de otra y recibe cero filas en los tres
      # casos. El plan pide que esta prueba se quede en CI para siempre.
      - name: Aislamiento entre clinicas
        run: ./tests/tenancy/run.sh
